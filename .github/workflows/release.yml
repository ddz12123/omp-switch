name: Release

# Push a version tag such as v1.0.0, or run the workflow manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default to read-only. Jobs that create or upload a release opt into write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $expected_tag." >&2
            exit 1
          fi

      - name: Run lint and type checks
        run: pnpm run check

      - name: Audit production dependencies
        id: audit
        shell: bash
        run: |
          set +e
          pnpm audit --prod --audit-level critical --json --registry=https://registry.npmjs.org > pnpm-audit.json
          audit_exit=$?
          set -e

          if [ ! -s pnpm-audit.json ]; then
            printf '{"error":"pnpm audit did not produce a report","exitCode":%s}\n' "$audit_exit" > pnpm-audit.json
          fi

          cat pnpm-audit.json
          echo "exit_code=$audit_exit" >> "$GITHUB_OUTPUT"

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: pnpm-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce critical vulnerability gate
        if: steps.audit.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Production dependency audit failed. Review the uploaded pnpm-audit.json report." >&2
          exit 1

  prepare:
    name: Prepare draft release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" --notes "release $tag"
          fi

  release:
    name: Build ${{ matrix.os }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--win'
          - os: macos-latest
            args: '--mac'
          - os: ubuntu-latest
            # Snap needs an additional snapcraft toolchain in CI; publish AppImage and deb here.
            args: '--linux AppImage deb'
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Windows or Linux
        if: runner.os != 'macOS'
        shell: bash
        run: |
          pnpm run build
          pnpm exec electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use neutral names here so electron-builder never sees an empty CSC_LINK/APPLE_* value.
          MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          pnpm run build

          if [[ -n "${MAC_CSC_LINK:-}" ]]; then
            export CSC_LINK="$MAC_CSC_LINK"
            if [[ -n "${MAC_CSC_KEY_PASSWORD:-}" ]]; then
              export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            else
              unset CSC_KEY_PASSWORD
            fi
            echo "macOS code signing: enabled"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "macOS code signing: disabled (CSC_LINK secret is not configured)"
          fi

          if [[ -n "${MAC_APPLE_ID:-}" && -n "${MAC_APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${MAC_APPLE_TEAM_ID:-}" ]]; then
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
            echo "macOS notarization: enabled"
          else
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            echo "macOS notarization: disabled (Apple credentials are incomplete)"
          fi

          pnpm exec electron-builder ${{ matrix.args }} --publish always
